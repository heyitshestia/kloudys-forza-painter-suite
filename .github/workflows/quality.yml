name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - "RTTI.dat"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-app:
    name: Windows app and editor
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      TEMP: ${{ github.workspace }}\runtime\ci-temp
      TMP: ${{ github.workspace }}\runtime\ci-temp

    steps:
      - name: Check out KFPS
        uses: actions/checkout@v4

      - name: Prepare stable Windows temporary path
        shell: pwsh
        run: New-Item -ItemType Directory -Path $env:TEMP -Force | Out-Null

      - name: Set up 64-bit Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install locked Python dependencies
        run: python -m pip install -r requirements.lock.txt

      - name: Compile Python sources
        run: >-
          python -m compileall -q
          KFPS.UI/src
          kfps_shapes
          native.py
          fh6_probe.py
          json_preview_renderer.py

      - name: Run Python and QML contract tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: python -m unittest discover -s KFPS.UI/tests -p "test_*.py" -v

      - name: Lint the QML entry point and extracted Outputs menu
        shell: pwsh
        run: |
          $pyside = python -c "import pathlib, PySide6; print(pathlib.Path(PySide6.__file__).parent)"
          $qmlLint = Join-Path $pyside "qmllint.exe"
          & $qmlLint -I KFPS.UI/qml KFPS.UI/qml/Main.qml KFPS.UI/qml/components/OutputExplorerContextMenus.qml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check and test the Fabric editor boundary
        run: |
          node --check tools/fabric-editor/editor-core.js
          node --check tools/fabric-editor/editor-fabric-adapter.js
          node --check tools/fabric-editor/editor.js
          node tools/fabric-editor/tests/editor-core.node.js
          node tools/fabric-editor/tests/editor-shell.node.js

      - name: Launch the real Outputs page offscreen
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: >-
          python KFPS.UI/app.py
          --demo
          --allow-unsupported-python
          --skip-startup-index
          --skip-startup-thumbnails
          --page outputs
          --width 1600
          --height 900
          --layout-report outputs-layout.json

      - name: Upload layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outputs-layout
          path: outputs-layout.json
          if-no-files-found: warn

  cloudflare-workers:
    name: ${{ matrix.name }} worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Supporter activation
            directory: tools/supporter_activation_worker
          - name: FH6 RTTI relay
            directory: tools/fh6_rtti_relay_worker
          - name: Community service
            directory: tools/community_worker

    steps:
      - name: Check out KFPS
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Install locked dependencies
        working-directory: ${{ matrix.directory }}
        run: npm ci

      - name: Typecheck
        working-directory: ${{ matrix.directory }}
        run: npm run typecheck

      - name: Test
        working-directory: ${{ matrix.directory }}
        run: npm test

      - name: Check Community rollout isolation
        if: matrix.name == 'Community service'
        run: python tools/community_worker/tools/check_deployment_contract.py

  community-e2e:
    name: Disposable Community end-to-end
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      TEMP: ${{ github.workspace }}\runtime\ci-temp
      TMP: ${{ github.workspace }}\runtime\ci-temp

    steps:
      - name: Check out KFPS
        uses: actions/checkout@v4

      - name: Prepare stable Windows temporary path
        shell: pwsh
        run: New-Item -ItemType Directory -Path $env:TEMP -Force | Out-Null

      - name: Set up 64-bit Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/community_worker/package-lock.json

      - name: Install locked Python dependencies
        run: python -m pip install -r requirements.lock.txt

      - name: Install locked Community Worker dependencies
        working-directory: tools/community_worker
        run: npm ci

      - name: Audit Community test toolchain
        working-directory: tools/community_worker
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npm audit --audit-level=moderate
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { exit $LASTEXITCODE }
            Write-Host "npm audit failed on attempt $attempt; retrying after a transient-service delay."
            Start-Sleep -Seconds (15 * $attempt)
          }

      - name: Run fresh-state Community validation
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: python tools/community_worker/tools/run_kfps_e2e.py --skip-install

      - name: Upload sanitized Community failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: community-e2e-worker-logs
          path: runtime/community-e2e/**/*.log
          if-no-files-found: warn

  update-publication-plan:
    name: Plan stable update publication
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - windows-app
      - cloudflare-workers
      - community-e2e
    runs-on: windows-2022
    permissions:
      contents: read
    outputs:
      required: ${{ steps.plan.outputs.required }}

    steps:
      - name: Check out KFPS
        uses: actions/checkout@v4

      - name: Compare committed and published versions
        id: plan
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          $channel = Get-Content -LiteralPath updates/stable/channel.json -Raw | ConvertFrom-Json
          if ($channel.schema -ne 'kfps.update-channel.v1' -or $channel.channel -ne 'stable') {
            throw 'The committed stable channel is invalid.'
          }
          $match = [regex]::Match([string]$channel.manifest.url, '/kfps-update-(\d+(?:\.\d+){1,3})(?:-[A-Za-z0-9._-]+)?\.json(?:\?.*)?$')
          if (-not $match.Success) { throw 'The committed stable channel does not identify a KFPS version.' }
          $published = $match.Groups[1].Value
          $required = $version -ne $published
          "required=$($required.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Committed version: $version"
          Write-Host "Published version: $published"
          Write-Host "Publication required: $required"

  publish-version-update:
    name: Publish signed stable update
    if: needs.update-publication-plan.outputs.required == 'true'
    needs:
      - update-publication-plan
    runs-on: windows-2022
    timeout-minutes: 90
    environment: updater-production
    permissions:
      contents: write
    env:
      TEMP: ${{ github.workspace }}\runtime\publish-temp
      TMP: ${{ github.workspace }}\runtime\publish-temp

    steps:
      - name: Check out the validated commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare stable Windows temporary path
        shell: pwsh
        run: New-Item -ItemType Directory -Path $env:TEMP -Force | Out-Null

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: tools/bootstrap_updater/go.sum

      - name: Publish and advance the signed channel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          KFPS_UPDATER_PRIVATE_KEY: ${{ secrets.KFPS_UPDATER_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KFPS_UPDATER_PRIVATE_KEY)) {
            throw 'The updater-production signing secret is unavailable.'
          }
          $keyPath = Join-Path $env:RUNNER_TEMP 'kfps-updater-production.private'
          [IO.File]::WriteAllText($keyPath, $env:KFPS_UPDATER_PRIVATE_KEY.Trim() + "`n", [Text.UTF8Encoding]::new($false))
          try {
            & ./tools/bootstrap_updater/Publish-VersionUpdate.ps1 `
              -Repository '${{ github.repository }}' `
              -Commit '${{ github.sha }}' `
              -PrivateKeyPath $keyPath `
              -OutputRoot (Join-Path $env:RUNNER_TEMP 'kfps-version-update') `
              -Publish
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item -LiteralPath $keyPath -Force -ErrorAction SilentlyContinue
          }
