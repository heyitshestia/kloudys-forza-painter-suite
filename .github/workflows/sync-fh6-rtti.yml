name: Sync FH6 RTTI fallback

on:
  schedule:
    - cron: "17 3 * * *"
  repository_dispatch:
    types:
      - fh6-rtti-registry-updated
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-fh6-rtti.yml"
      - "tools/fh6_rtti_sync/**"
      - "fh6_rtti_registry.py"

permissions:
  contents: write

concurrency:
  group: sync-fh6-rtti-fallback
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'heyitshestia/kloudys-forza-painter-suite'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate and synchronize RTTI.dat
        run: python tools/fh6_rtti_sync/sync_registry.py

      - name: Detect registry change
        id: registry
        shell: bash
        run: |
          if git diff --quiet -- RTTI.dat; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit synchronized fallback
        if: steps.registry.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- RTTI.dat
          git commit -m "Update FH6 RTTI fallback from relay"
          git push origin HEAD:main
